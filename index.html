<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChakriGhor - Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#f3f6fb;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box{
  width:92%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  color:#0757c8;
  font-size:28px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:7px;
  margin-bottom:17px;
  font-size:15px;
}

button{
  width:100%;
  padding:13px;
  background:#0757c8;
  color:white;
  border:0;
  border-radius:7px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#0649a8;
}

.message{
  text-align:center;
  margin-top:15px;
  color:#0757c8;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#0757c8;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">ChakriGhor</div>

  <p class="subtitle">আপনার অ্যাকাউন্টে Login করুন</p>

  <form onsubmit="loginUser(event)">

    <label>মোবাইল / Email</label>
    <input
      type="text"
      id="username"
      placeholder="আপনার মোবাইল বা Email"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="আপনার Password"
      required
    >

    <button type="submit">Login</button>

  </form>

  <p class="message" id="message"></p>

  <a class="back" href="index.html">← Home Page-এ ফিরে যান</a>

</div>

<script>

function loginUser(event){

  event.preventDefault();

  let username = document.getElementById("username").value;
  let password = document.getElementById("password").value;

  if(username && password){

    document.getElementById("message").innerText =
    "Login সফল হয়েছে!";

  }

}

</script>

</body>
</html>
