<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChakriGhor - Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#0b63ce,#1689ff);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  background:white;
  width:100%;
  max-width:430px;
  padding:30px;
  border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}

.logo{
  text-align:center;
  color:#0b63ce;
  font-size:28px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  margin-bottom:20px;
  border-bottom:1px solid #ddd;
}

.tabs button{
  flex:1;
  padding:12px;
  border:0;
  background:white;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}

.tabs button.active{
  color:#0b63ce;
  border-bottom:3px solid #0b63ce;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  margin-bottom:15px;
  border:1px solid #ddd;
  border-radius:6px;
  font-size:15px;
}

.submit{
  width:100%;
  padding:13px;
  background:#0b63ce;
  color:white;
  border:0;
  border-radius:6px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  background:#e8f7ed;
  color:#16833a;
  border-radius:6px;
  text-align:center;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#0b63ce;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">🏠 ChakriGhor</div>

<div class="subtitle">
চাকরি খুঁজুন এবং আপনার ক্যারিয়ার শুরু করুন
</div>

<div class="tabs">

<button
id="loginTab"
class="active"
onclick="showForm('login')">
Login
</button>

<button
id="signupTab"
onclick="showForm('signup')">
Sign Up
</button>

</div>


<!-- LOGIN -->

<div
id="loginForm"
class="form active">

<label>Email / Mobile</label>

<input
type="text"
placeholder="Email অথবা মোবাইল নম্বর"
required>

<label>Password</label>

<input
type="password"
placeholder="Password"
required>

<button
class="submit"
onclick="loginUser()">
Login
</button>

<div
id="loginMessage"
class="message">
Login সফল হয়েছে!
</div>

</div>


<!-- SIGN UP -->

<div
id="signupForm"
class="form">

<label>আপনার নাম</label>

<input
type="text"
placeholder="পুরো নাম"
required>

<label>মোবাইল নম্বর</label>

<input
type="tel"
placeholder="01XXXXXXXXX"
required>

<label>Email</label>

<input
type="email"
placeholder="example@gmail.com"
required>

<label>আপনি কে?</label>

<select>
<option>Job Seeker</option>
<option>Employer</option>
</select>

<label>Password</label>

<input
type="password"
placeholder="একটি Password দিন"
required>

<button
class="submit"
onclick="signupUser()">
Create Account
</button>

<div
id="signupMessage"
class="message">
Account তৈরি হয়েছে!
</div>

</div>

<a
class="back"
href="index.html">
← ChakriGhor Home
</a>

</div>


<script>

function showForm(type){

const loginForm =
document.getElementById("loginForm");

const signupForm =
document.getElementById("signupForm");

const loginTab =
document.getElementById("loginTab");

const signupTab =
document.getElementById("signupTab");

if(type === "login"){

loginForm.classList.add("active");
signupForm.classList.remove("active");

loginTab.classList.add("active");
signupTab.classList.remove("active");

}else{

signupForm.classList.add("active");
loginForm.classList.remove("active");

signupTab.classList.add("active");
loginTab.classList.remove("active");

}

}

function loginUser(){

document
.getElementById("loginMessage")
.style.display="block";

}

function signupUser(){

document
.getElementById("signupMessage")
.style.display="block";

}

</script>

</body>
</html>
