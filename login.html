<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChakriGhor Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    min-height:100vh;
}

.header{
    background:#0757c8;
    padding:16px 20px;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.home{
    color:white;
    text-decoration:none;
    font-size:16px;
}

.login-container{
    width:90%;
    max-width:400px;
    background:white;
    margin:60px auto;
    padding:30px 25px;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#0757c8;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    margin-bottom:18px;
    font-size:15px;
}

.login-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:7px;
    background:#0757c8;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.signup{
    text-align:center;
    margin-top:22px;
}

.signup a{
    color:#0757c8;
    font-weight:bold;
    text-decoration:none;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="header">

    <div class="logo">
        ChakriGhor
    </div>

    <a class="home" href="index.html">
        🏠 Home
    </a>

</div>

<div class="login-container">

    <h2>Login করুন</h2>

    <form id="loginForm">

        <label>মোবাইল / Email</label>

        <input
            type="text"
            id="email"
            placeholder="মোবাইল বা Email লিখুন"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Password লিখুন"
            required
        >

        <button class="login-btn" type="submit">
            Login
        </button>

    </form>

    <div class="message" id="message"></div>

    <div class="signup">
        নতুন User?
        <a href="signup.html">Sign Up করুন</a>
    </div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if(email !== "" && password !== ""){

        localStorage.setItem("chakrighorUser", email);

        document.getElementById("message").innerHTML =
        "✅ Login সফল হয়েছে";

        setTimeout(function(){

            window.location.href = "index.html";

        },1000);

    }

});

</script>

</body>
</html>
