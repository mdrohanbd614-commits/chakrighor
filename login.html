<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChakriGhor Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f6fc;
}

header {
    background: #0757c8;
    color: white;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.home {
    color: white;
    text-decoration: none;
}

.container {
    width: 90%;
    max-width: 380px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

h2 {
    text-align: center;
    color: #0757c8;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    background: #0757c8;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 17px;
    font-weight: bold;
}

.signup {
    text-align: center;
    margin-top: 20px;
}

.signup a {
    color: #0757c8;
    text-decoration: none;
    font-weight: bold;
}

#message {
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<header>

    <div class="logo">ChakriGhor</div>

    <a class="home" href="index.html">
        🏠 Home
    </a>

</header>

<div class="container">

    <h2>Login</h2>

    <form id="loginForm">

        <label>Email অথবা মোবাইল</label>

        <input
            type="text"
            id="username"
            placeholder="Email অথবা মোবাইল নম্বর"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="signup">
        Account নেই?
        <a href="signup.html">Sign Up</a>
    </div>

</div>

<script>

document.getElementById("loginForm").onsubmit = function(event) {

    event.preventDefault();

    var username = document.getElementById("username").value;
    var password = document.getElementById("password").value;

    if (username && password) {

        localStorage.setItem("chakrighor_user", username);

        document.getElementById("message").innerHTML =
            "✅ Login সফল হয়েছে!";

        setTimeout(function() {
            window.location.href = "index.html";
        }, 1000);

    }

};

</script>

</body>
</html>
